name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    paths-ignore:
      - '**.md'
      - '**.png'

  pull_request:


jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Pre-commit on all files
        run: BANDCAMP_USERNAME="test_user" IDENTITY="test_identity_value" uv run pre-commit run --all-files
